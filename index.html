   gx = quanto o lado direito do celular aponta pra baixo (+1 = lado direito embaixo, -1 = lado direito em cima). */
addEventListener('deviceorientation',e=>{
 const b=e.beta,g=e.gamma;if(typeof b!='number'||typeof g!='number')return;
 const r=Math.PI/180,gx=Math.cos(b*r)*Math.sin(g*r),ax=Math.abs(gx);
 let l=S.phL===null?false:S.phL;
 if(ax>.72){l=true;const d=gx>0?1:-1;S.phD=d;}else if(ax<.5)l=false;
 if(S.phL===null){S.phL=l;return}
 if(l===S.phL){clearTimeout(S.pht);S.phW=null;return}
 if(S.phW===l)return; /* já agendado: não reinicia o tempo a cada leitura do sensor */
 S.phW=l;clearTimeout(S.pht);S.pht=setTimeout(()=>{S.phW=null;S.phL=l;phApply(l)},250);
});

/* mexer no celular em tela cheia: mostra de novo os botões girar e voltar (e desfaz o "esconder" do toque duplo/segurar).
   Nada aqui sai da tela cheia: só o botão voltar (✕) ou o botão invisível de 2 toques. */
S.mvB=null;S.mvT=0;
function mvShow(){const n=Date.now();if(n-S.mvT<400)return;S.mvT=n;document.body.classList.remove('hb');if(S.showOv)S.showOv()}
addEventListener('deviceorientation',e=>{
 if(!(S.ff||isFs())){S.mvB=null;return}
 const b=e.beta,g=e.gamma;if(typeof b!='number'||typeof g!='number')return;
 const r=S.mvB;if(!r){S.mvB=[b,g];return}
 if(Math.abs(b-r[0])>12||Math.abs(g-r[1])>12){S.mvB=[b,g];mvShow()}
});

   try{f.blur();window.focus()}catch(x){}
   f.src=u;w.classList.remove('vmo');S.fa=0;return}
  return fx.apply(this,arguments)};
})();
</script>
<script id="av-js">
(()=>{
 /* ===== abas do admin: Lista / Grande (2 colunas) e Config minimalista ===== */
 const AVK='cn_adv',avm=()=>{try{return localStorage.getItem(AVK)||'l'}catch(e){return 'l'}};
 window.avSet=m=>{try{localStorage.setItem(AVK,m)}catch(e){}avInit()};
 function avCfg(d){[...d.children].forEach(e=>{if(!e.classList.contains('box')||e.querySelector(':scope>.xh'))return;
  const b=e.querySelector('b'),h=document.createElement('div');h.className='xh';h.innerHTML='<span></span><i>›</i>';h.firstChild.textContent=(b?b.textContent:'Opções').trim();
  h.onclick=()=>e.classList.toggle('xo');
  const mv=e.querySelector(':scope>.mv');mv?mv.after(h):e.prepend(h)})}
 function avInit(){const d=document.getElementById('ad');if(!d)return;
  const t=S.at,okT=['t','v','s'].includes(t);let bar=document.getElementById('avt');
  if(!okT){if(bar)bar.remove();d.classList.remove('avg','cfgc');return}
  if(!bar){bar=document.createElement('div');bar.id='avt';bar.className='avt';d.parentNode.insertBefore(bar,d)}
  const m=avm();
  bar.innerHTML='<button class="btn '+(m=='l'?'':'o')+' s" onclick="avSet(\'l\')">☰ Lista</button><button class="btn '+(m=='g'?'':'o')+' s" onclick="avSet(\'g\')">▦ Grade (2 colunas)</button>';
  d.classList.toggle('avg',m=='g');d.classList.toggle('cfgc',t=='s');
  if(t=='s')avCfg(d)}
 const _ad3=ad;ad=async function(){await _ad3.apply(this,arguments);avInit()};

 /* ===== botão voltar flutuante (arrastável) com histórico ===== */
 S.hist=S.hist||[];
 const SHOW=['play','fav','me','admin'];
 const hs=()=>{const c=S.cur,p=S.tab=='play'&&c&&c.t;return{tab:S.tab,kind:S.tab=='list'?S.kind:'',at:S.tab=='admin'?S.at:'',et:S.tab=='admin'?S.et:0,vq:S.tab=='admin'?S.vq:'',t:p?c.t.id:0,e:p&&c.e?c.e.id:0,li:p?(c.li||0):0}};
 const sig=x=>x?[x.tab,x.kind,x.at,x.t,x.e,x.li].join('|'):'';
 let hy=0;addEventListener('scroll',()=>{hy=scrollY},{passive:true});
 const _dr3=draw;draw=function(){
  const prev=S.hcur;if(prev)prev.y=hy;
  const r=_dr3.apply(this,arguments);
  const cur=hs();
  if(!S.hback&&prev&&sig(cur)!=sig(prev)){S.hist.push(prev);if(S.hist.length>40)S.hist.shift()}
  S.hcur=cur;return r};
 S.hcur=hs();
 window.gbkBack=function(){
  let t=null;
  while(S.hist.length){const c=S.hist.pop();if(sig(c)!=sig(S.hcur)){t=c;break}}
  S.hback=1;
  try{
   if(!t){if(S.tab!='home')go('home');return}
   if(t.tab=='play'&&t.t)play(t.t,t.e||undefined,t.li||0);
   else{if(t.at)S.at=t.at;if(t.et)S.et=t.et;if(t.vq!=null)S.vq=t.vq;go(t.tab,t.kind||undefined)}
   const y=t.y||0;[80,300,800].forEach(ms=>setTimeout(()=>{if(sig(S.hcur)==sig(t))scrollTo(0,y)},ms))
  }finally{S.hback=0}};
 const b=document.createElement('button');b.id='gbk';b.setAttribute('aria-label','Voltar');b.innerHTML=ic(I.b);document.body.appendChild(b);
 const KP='cn_bkp';
 const place=()=>{let p=null;try{p=JSON.parse(localStorage.getItem(KP))}catch(e){}
  if(p&&typeof p.x=='number'){const W=Math.max(0,innerWidth-44),H=Math.max(0,innerHeight-44);b.style.left=Math.max(0,Math.min(W,p.x*W))+'px';b.style.top=Math.max(0,Math.min(H,p.y*H))+'px'}
  else{b.style.left='14px';b.style.top='calc(8px + env(safe-area-inset-top))'}};
 place();addEventListener('resize',place);
 let tm=0,drag=0,sx=0,sy=0,ox=0,oy=0,sup=0;
 b.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;const r=b.getBoundingClientRect();ox=r.left;oy=r.top;drag=0;clearTimeout(tm);
  tm=setTimeout(()=>{drag=1;b.classList.add('drg');try{navigator.vibrate&&navigator.vibrate(30)}catch(x){}try{b.setPointerCapture(e.pointerId)}catch(x){}},450)});
 b.addEventListener('pointermove',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;
  if(!drag){if(Math.abs(dx)>10||Math.abs(dy)>10)clearTimeout(tm);return}
  const W=Math.max(0,innerWidth-b.offsetWidth),H=Math.max(0,innerHeight-b.offsetHeight);
  b.style.left=Math.max(0,Math.min(W,ox+dx))+'px';b.style.top=Math.max(0,Math.min(H,oy+dy))+'px'});
 const end=()=>{clearTimeout(tm);if(drag){const r=b.getBoundingClientRect(),W=Math.max(1,innerWidth-b.offsetWidth),H=Math.max(1,innerHeight-b.offsetHeight);
   try{localStorage.setItem(KP,JSON.stringify({x:r.left/W,y:r.top/H}))}catch(x){}b.classList.remove('drg');sup=Date.now()}drag=0};
 b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);
 b.addEventListener('click',e=>{if(Date.now()-sup<400){e.preventDefault();return}gbkBack()});
 setInterval(()=>{const hide=!SHOW.includes(S.tab)||S.ff||document.fullscreenElement||document.webkitFullscreenElement||S.oved||S.bled||document.getElementById('vzp');
  b.style.display=hide?'none':'grid'},200);
})();
</script>
