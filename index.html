 const bad=ls.filter(x=>!/^https?:\/\//i.test(x));if(bad.length)return alert('Estas linhas não parecem um link (precisa começar com http):\n\n'+bad.slice(0,3).join('\n'));
 const sn=+$('#m_s').value||1,n0=+$('#m_n').value||1;
 if(!confirm('Adicionar '+ls.length+' episódio(s): Temporada '+sn+', do episódio '+n0+' ao '+(n0+ls.length-1)+'?'))return;
 const{data:s,error}=await sb.from('seasons').upsert({title_id:S.et,number:sn},{onConflict:'title_id,number'}).select().single();
 if(error)return alert(error.message);
 if(ok(await sb.from('episodes').insert(ls.map((u,i)=>({season_id:s.id,number:n0+i,name:null,url:u}))))){await load();ad();alert(ls.length+' episódio(s) adicionados!')}
}
async function svL(){const u=$('#l_u').value.trim();if(!u)return alert('Informe o link.');if(ok(await sb.from('links').insert({title_id:S.et,label:$('#l_l').value.trim()||null,url:u}))){await load();ad()}}
async function dE(id){if(confirm('Apagar episódio?')){await sb.from('episodes').delete().eq('id',id);await load();ad()}}
async function dL(id){if(confirm('Apagar link?')){await sb.from('links').delete().eq('id',id);await load();ad()}}
async function tSec(k,v){if(ok(await sb.from('sections').update({enabled:v}).eq('key',k)))S.secs.find(s=>s.key==k).enabled=v}
async function cf(k,v){if(ok(await sb.from('settings').upsert({key:k,value:String(v)})))S.set[k]=String(v)}
function ovs(k,v,u){S.set[k]=String(v);$('#o_'+k).textContent=v+u;const a=$('#pv1'),b=$('#pv2'),c=$('#pv3');if(a)a.style.cssText=ovp(ovn('ov_fx',12),ovn('ov_fy',50))+';--s:'+ovn('ov_sf',1);if(b)b.style.cssText=ovp(ovn('ov_rx',88),ovn('ov_ry',50))+';--s:'+ovn('ov_sr',1);if(c)c.style.cssText='--s:'+ovn('ov_sl',1)}
function lss(k,v,u){S.set[k]=String(v);$('#o_'+k).textContent=v+u;const c=$('#lpv');if(c)c.style.cssText=ovp(ovn('ov_lx',97),ovn('ov_ly',6))+';--s:'+ovn('ov_sl',1)+';--o:'+ovn('ov_lo',100)/100}
const PK=[['yt','YouTube'],['dr','Google Drive'],['ar','Internet Archive'],['vm','Vimeo'],['dm','Dailymotion'],['mp','Vídeo .mp4'],['ot','Outros']];
const ppx=k=>ovn('ov_lx_'+k,ovn('ov_lx',97)),ppy=k=>ovn('ov_ly_'+k,ovn('ov_ly',6));
function ppSel(){const k=$('#pps').value;$('#ppx').value=ppx(k);$('#ppy').value=ppy(k);ppUp(k)}
function ppUp(k){$('#o_ppx').textContent=ppx(k)+'%';$('#o_ppy').textContent=ppy(k)+'%';const c=$('#ppv');if(c)c.style.cssText=ovp(ppx(k),ppy(k))+';--s:'+ovn('ov_sl',1)+';--o:'+ovn('ov_lo',100)/100}
function ppMv(){const k=$('#pps').value;S.set['ov_lx_'+k]=$('#ppx').value;S.set['ov_ly_'+k]=$('#ppy').value;ppUp(k)}
async function svPP(){const k=$('#pps').value;if(ok(await sb.from('settings').upsert([{key:'ov_lx_'+k,value:String(ppx(k))},{key:'ov_ly_'+k,value:String(ppy(k))}])))alert('Posição salva para este player.')}
async function rsPP(){const k=$('#pps').value;if(ok(await sb.from('settings').upsert([{key:'ov_lx_'+k,value:''},{key:'ov_ly_'+k,value:''}]))){S.set['ov_lx_'+k]='';S.set['ov_ly_'+k]='';ppSel();alert('Este player voltou a usar a posição padrão.')}}
async function svDZ(){if(ok(await sb.from('settings').upsert([{key:'ov_dz',value:String(ovn('ov_dz',2))}])))alert('Salvo para todos. Abra um vídeo do Drive para ver o resultado.')}
function lsr(v){S.set.ov_ra=String(v);$('#o_ov_ra').textContent=v+'s'}
async function svTG(){S.set.ov_tg=$('#tg_on').checked?'1':'0';if(ok(await sb.from('settings').upsert([{key:'ov_tg',value:S.set.ov_tg},{key:'ov_ra',value:String(ovn('ov_ra',2))}])))alert('Salvo para todos.')}
function lsx(k,v,u){S.set[k]=String(v);$('#o_'+k).textContent=v+u;const c=$('#xpv');if(c)c.style.cssText=ovp(ovn('ov_xx',4),ovn('ov_xy',6))+';--s:'+ovn('ov_sx',1)+';--o:'+ovn('ov_xo',100)/100+';display:grid'}
async function svXS(){
 const d={ov_xx:4,ov_xy:6,ov_sx:1,ov_xo:100},rows=Object.keys(d).map(k=>({key:k,value:String(S.set[k]??d[k])}));
 if(ok(await sb.from('settings').upsert(rows)))alert('Salvo para todos.')}
async function svLS(){
 S.set.ov_la=$('#ov_la').checked?'1':'0';S.set.ov_au=$('#ov_au').checked?'1':'0';S.set.ov_fm=$('#ov_fm').checked?'1':'0';
 const rows=['ov_lx','ov_ly','ov_sl','ov_lo','ov_la','ov_au','ov_fm'].map(k=>({key:k,value:String(S.set[k]??({ov_lx:97,ov_ly:6,ov_sl:1,ov_lo:100,ov_la:1,ov_au:1,ov_fm:1})[k])}));
 if(ok(await sb.from('settings').upsert(rows)))alert('Salvo para todos.')}
async function svOV(){
 const all=$('#ov_all').checked,ids=[...document.querySelectorAll('.ovt:checked')].map(c=>c.value);
 const v=all?'all':ids.join(',');S.set.ov_titles=v;
 const rows=[{key:'ov_titles',value:v},...['ov_fx','ov_fy','ov_rx','ov_ry','ov_t','ov_sf','ov_sr'].map(k=>({key:k,value:String(S.set[k]??({ov_fx:12,ov_fy:50,ov_rx:88,ov_ry:50,ov_t:4,ov_sf:1,ov_sr:1})[k])}))];
 rows.forEach(r=>S.set[r.key]=r.value);
 if(ok(await sb.from('settings').upsert(rows)))alert('Salvo para todos.')}
const UK=['ui_cw','ui_hh','ui_ww','ui_bs'];
function ui(k,v,u){S.set[k]=String(v);$('#o_'+k).textContent=v+u;applyUI()}
async function svUI(){if(ok(await sb.from('settings').upsert(UK.filter(k=>S.set[k]).map(k=>({key:k,value:S.set[k]})))))alert('Tamanhos salvos para todos.')}
async function rsUI(){const d={ui_cw:'120',ui_hh:'260',ui_ww:'190',ui_bs:'1'};if(ok(await sb.from('settings').upsert(UK.map(k=>({key:k,value:d[k]}))))){UK.forEach(k=>S.set[k]=d[k]);applyUI();ad()}}
async function svS(){
 const rows=['support_title','pix_info','instagram','whatsapp','qr_text'].map(k=>({key:k,value:$('#s_'+k).value.trim()}));
 if(ok(await sb.from('settings').upsert(rows))){rows.forEach(r=>S.set[r.key]=r.value);alert('Salvo.')}
}
async function gv(v){
 const n=+$('#g_n').value,u=v&&n>0?new Date(Date.now()+n*$('#g_u').value).toISOString():'';
 if(ok(await sb.from('settings').upsert([{key:'guest_enabled',value:String(!!v)},{key:'guest_until',value:u}]))){S.set.guest_enabled=String(!!v);S.set.guest_until=u;ad()}
}
boot();
</script></body></html>
