 si depois do tempo abaixo, e isso pode fechar o menu da engrenagem do player se você demorar.</div><div class="rg"><span>Detectar próximo toque após</span><span class="mu" id="o_ov_ra" style="padding:0">${ovn('ov_ra',2)}s</span><input type="range" min="1" max="10" step="1" value="${ovn('ov_ra',2)}" oninput="lsr(this.value)"></div><div class="row"><button class="btn s" onclick="svTG()">Salvar</button></div></div><div class="box"><b>Controles do Google Drive</b><div class="mu" style="padding:4px 0">O Drive monta os controles para uma tela de celular inteira, e na caixa pequena do app eles saem grandes e fora de lugar. Este ajuste faz o Drive achar que a tela é maior, então os botões ficam menores e no lugar certo. Não dá para deixar os botões do Drive transparentes, porque o app não controla o desenho dentro do player dele. 1 desliga o ajuste.</div><div class="rg"><span>Zoom do Drive</span><span class="mu" id="o_ov_dz" style="padding:0">${ovn('ov_dz',2)}x</span><input type="range" min="1" max="3.5" step="0.1" value="${ovn('ov_dz',2)}" oninput="S.set.ov_dz=String(this.value);$('#o_ov_dz').textContent=this.value+'x'"></div><div class="row"><button class="btn s" onclick="svDZ()">Salvar</button></div></div><div class="box"><b>Selo NOVO e faixa Recém-adicionados</b><label class="k"><input type="checkbox" ${newOn()?'checked':''} onchange="cf('new_on',this.checked)"> Mostrar selo NOVO nos títulos e a faixa "Recém-adicionados" na página inicial</label><div class="row" style="align-items:center"><span class="mu" style="padding:0">Fica como novo por:</span><select onchange="cf('new_days',this.value)" style="flex:1">${[3,7,14,30].map(n=>`<option value="${n}" ${newDays()==n?'selected':''}>${n} dias</option>`).join('')}</select></div></div><div class="box"><b>Download</b>${sw('downloads_on','Permitir download (só links .mp4)')}</div><div class="box"><b>Visitante</b><p class="mu" style="padding:4px 0">${gOn()?'Ativo'+(s.guest_until?' até '+new Date(s.guest_until).toLocaleString('p async function svT(){
